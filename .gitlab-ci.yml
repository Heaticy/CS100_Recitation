stages:
  - build
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# 每次推送验证课件可编译，并产出PDF供预览下载
build:
  stage: build
  tags:
    - latex-runner
  script:
    - make -j -C r1
    - mkdir -p dist
    - cp r1/build/CS100Linux.pdf dist/CS100-Recitation1.pdf
  artifacts:
    name: "CS100-Recitation1-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/CS100-Recitation1.pdf
    expire_in: 14 days
    when: always

# 打tag即发release，PDF作为可下载产物挂在release上
release:
  stage: release
  tags:
    - latex-runner
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - make -j -C r1
    - mkdir -p dist
    - cp r1/build/CS100Linux.pdf dist/CS100-Recitation1.pdf
  artifacts:
    name: "CS100-Recitation1-$CI_COMMIT_TAG"
    paths:
      - dist/CS100-Recitation1.pdf
    expire_in: never
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'CS100 Recitation 1 $CI_COMMIT_TAG'
    description: 'CS100 Recitation 1课件PDF，对应tag $CI_COMMIT_TAG。'
    assets:
      links:
        - name: 'CS100-Recitation1.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100-Recitation1.pdf?inline=false'
