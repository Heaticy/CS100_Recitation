stages:
  - build
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# 每次推送验证课件可编译，不产出artifact
build:
  stage: build
  tags:
    - latex-runner
  script:
    - make -j -C intro
    - make -j -C r0
    - make -j -C r1
    - make -j -C r3
    - make -j -C r4
    - make -j -C r5
    - make -j -C r6
    - make -j -C r7
    - make -C r7 check-demos

# 打tag时发release，PDF作为可下载产物
release:
  stage: release
  tags:
    - latex-runner
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - make -j -C intro
    - make -j -C r0
    - make -j -C r1
    - make -j -C r3
    - make -j -C r4
    - make -j -C r5
    - make -j -C r6
    - make -j -C r7
    - make -C r7 check-demos
    - mkdir -p dist
    - cp intro/build/CS100_Intro.pdf dist/CS100_Intro.pdf
    - cp r0/build/CS100_Recitation0.pdf dist/CS100_Recitation0.pdf
    - cp r1/build/CS100_Recitation1.pdf dist/CS100_Recitation1.pdf
    - cp r3/build/CS100_Recitation3.pdf dist/CS100_Recitation3.pdf
    - cp r4/build/CS100_Recitation4.pdf dist/CS100_Recitation4.pdf
    - cp r5/build/CS100_Recitation5.pdf dist/CS100_Recitation5.pdf
    - cp r6/build/CS100_Recitation6.pdf dist/CS100_Recitation6.pdf
    - cp r7/build/CS100_Recitation7.pdf dist/CS100_Recitation7.pdf
  artifacts:
    name: "CS100_Recitations-$CI_COMMIT_TAG"
    paths:
      - dist/
    expire_in: never
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'CS100 Recitations $CI_COMMIT_TAG'
    description: 'CS100习题课课件PDF，对应tag $CI_COMMIT_TAG。'
    assets:
      links:
        - name: 'CS100_Intro.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Intro.pdf?inline=false'
        - name: 'CS100_Recitation0.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Recitation0.pdf?inline=false'
        - name: 'CS100_Recitation1.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Recitation1.pdf?inline=false'
        - name: 'CS100_Recitation3.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Recitation3.pdf?inline=false'
        - name: 'CS100_Recitation4.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Recitation4.pdf?inline=false'
        - name: 'CS100_Recitation5.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Recitation5.pdf?inline=false'
        - name: 'CS100_Recitation6.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Recitation6.pdf?inline=false'
        - name: 'CS100_Recitation7.pdf'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/dist/CS100_Recitation7.pdf?inline=false'
