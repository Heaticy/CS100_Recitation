<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
  <title id="title">C与Python的执行路径</title>
  <desc id="desc">C源代码经过编译和链接成为机器码，由CPU执行。Python源代码编译成字节码，由CPython解释器解释执行；解释器本身也是本机程序。计算机包含操作系统、CPU与内存。</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ae3545"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#168b91"/></marker>
    <marker id="small-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#168b91"/></marker>
    <g id="paper"><path d="M0 0H83L116 33V138H0Z" fill="white" stroke="currentColor" stroke-width="3"/><path d="M83 0V33H116" fill="none" stroke="currentColor" stroke-width="3"/><path d="M19 103H89M19 116H72" stroke="currentColor" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/></g>
  </defs>
  <g font-family="Noto Sans CJK SC, sans-serif" fill="#273441">
    <!-- Two language lanes. -->
    <rect x="12" y="20" width="960" height="240" rx="24" fill="#fcf2f3"/>
    <rect x="12" y="285" width="960" height="240" rx="24" fill="#eff9f8"/>
    <text x="36" y="57" font-size="25" fill="#ae3545">C · 提前编译</text>
    <text x="36" y="322" font-size="25" fill="#168b91">Python · 运行时解释</text>

    <!-- C source, compiler gear, native executable. -->
    <use href="#paper" x="46" y="82" color="#ae3545"/>
    <text x="103" y="164" text-anchor="middle" font-size="55" fill="#ae3545">C</text>
    <text x="103" y="247" text-anchor="middle" font-size="23">源代码</text>
    <path d="M180 149H243" fill="none" stroke="#ae3545" stroke-width="4" marker-end="url(#red-arrow)"/>
    <g transform="translate(298 146)" fill="#ae3545">
      <rect x="-9" y="-49" width="18" height="98" rx="4"/>
      <rect x="-49" y="-9" width="98" height="18" rx="4"/>
      <rect x="-9" y="-49" width="18" height="98" rx="4" transform="rotate(45)"/>
      <rect x="-9" y="-49" width="18" height="98" rx="4" transform="rotate(-45)"/>
      <circle r="37"/><circle r="18" fill="#fcf2f3"/>
    </g>
    <text x="298" y="230" text-anchor="middle" font-size="23">编译＋链接</text>
    <path d="M355 149H409" fill="none" stroke="#ae3545" stroke-width="4" marker-end="url(#red-arrow)"/>
    <rect x="427" y="87" width="190" height="130" rx="14" fill="#ae3545"/>
    <circle cx="445" cy="104" r="4" fill="#ffdcba"/><circle cx="460" cy="104" r="4" fill="#ffdcba"/>
    <text x="522" y="145" text-anchor="middle" font-family="monospace" font-size="25" fill="white">0100 1101</text>
    <text x="522" y="181" text-anchor="middle" font-family="monospace" font-size="25" fill="white">1011 0010</text>
    <text x="522" y="247" text-anchor="middle" font-size="23">机器码</text>
    <text x="775" y="131" text-anchor="middle" font-size="23" fill="#ae3545">直接执行</text>

    <!-- Python source, bytecode ticket, friendly interpreter robot. -->
    <use href="#paper" x="46" y="347" color="#168b91"/>
    <text x="104" y="425" text-anchor="middle" font-size="42" fill="#168b91">.py</text>
    <text x="104" y="512" text-anchor="middle" font-size="23">源代码</text>
    <path d="M180 415H287" fill="none" stroke="#168b91" stroke-width="4" marker-end="url(#teal-arrow)"/>
    <text x="232" y="394" text-anchor="middle" font-size="20" fill="#168b91">编译</text>
    <rect x="305" y="355" width="184" height="125" rx="14" fill="white" stroke="#168b91" stroke-width="3"/>
    <rect x="305" y="355" width="184" height="31" rx="12" fill="#d1efea"/>
    <path d="M328 406H380M397 406H465M328 430H420M328 454H367M385 454H448" stroke="#168b91" stroke-width="9" stroke-linecap="round" opacity=".75"/>
    <text x="397" y="512" text-anchor="middle" font-size="23">字节码</text>
    <path d="M506 415H577" fill="none" stroke="#168b91" stroke-width="4" marker-end="url(#teal-arrow)"/>
    <g transform="translate(662 410)">
      <path d="M0-54V-73" stroke="#168b91" stroke-width="5"/>
      <circle cy="-79" r="8" fill="#eeb34d"/>
      <rect x="-69" y="-22" width="138" height="37" rx="10" fill="#168b91"/>
      <rect x="-55" y="-52" width="110" height="96" rx="22" fill="white" stroke="#168b91" stroke-width="4"/>
      <rect x="-42" y="-34" width="84" height="47" rx="14" fill="#dcf4ef"/>
      <circle cx="-22" cy="-12" r="7" fill="#168b91"/><circle cx="22" cy="-12" r="7" fill="#168b91"/>
      <path d="M-14 25Q0 37 14 25" fill="none" stroke="#168b91" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="662" y="512" text-anchor="middle" font-size="23">CPython解释器</text>
    <text x="846" y="397" text-anchor="middle" font-size="21" fill="#168b91">本机程序</text>

    <!-- Computer as a physical monitor, with OS, CPU, RAM. -->
    <path d="M1190 480V521M1139 531H1294" stroke="#56616b" stroke-width="18" stroke-linecap="round"/>
    <rect x="1019" y="51" width="390" height="431" rx="23" fill="#354450"/>
    <rect x="1033" y="66" width="362" height="384" rx="13" fill="#f8fafb"/>
    <circle cx="1214" cy="466" r="5" fill="#c7d3da"/>
    <rect x="1054" y="86" width="318" height="47" rx="10" fill="#e3e9ee"/>
    <text x="1213" y="117" text-anchor="middle" font-size="23">操作系统</text>
    <g stroke="#af8033" stroke-width="6">
      <path d="M1136 176V193M1169 176V193M1202 176V193M1235 176V193M1268 176V193M1136 300V317M1169 300V317M1202 300V317M1235 300V317M1268 300V317"/>
      <path d="M1093 211H1110M1093 244H1110M1093 277H1110M1292 211H1309M1292 244H1309M1292 277H1309"/>
    </g>
    <rect x="1110" y="192" width="183" height="109" rx="13" fill="#f8e6be" stroke="#af8033" stroke-width="3"/>
    <text x="1202" y="241" text-anchor="middle" font-size="32" fill="#76521d">CPU</text>
    <text x="1202" y="275" text-anchor="middle" font-size="21" fill="#76521d">执行机器码</text>
    <path d="M1202 320V350" fill="none" stroke="#168b91" stroke-width="3" marker-start="url(#small-arrow)" marker-end="url(#small-arrow)"/>
    <rect x="1074" y="366" width="274" height="55" rx="8" fill="#d1efea" stroke="#168b91" stroke-width="2"/>
    <path d="M1095 410V422M1115 410V422M1135 410V422M1155 410V422M1175 410V422M1195 410V422M1215 410V422M1235 410V422M1255 410V422M1275 410V422M1295 410V422M1315 410V422" stroke="#d4a746" stroke-width="7"/>
    <text x="1211" y="401" text-anchor="middle" font-size="22">内存：程序与数据</text>

    <!-- Paths enter the CPU rather than implying that bytecode is native code. -->
    <path d="M632 152H957Q975 152 975 170V221Q975 233 991 233H1105" fill="none" stroke="#ae3545" stroke-width="4" marker-end="url(#red-arrow)"/>
    <path d="M744 418H941Q961 418 961 398V283Q961 271 977 271H1105" fill="none" stroke="#168b91" stroke-width="4" marker-end="url(#teal-arrow)"/>
    <text x="720" y="575" text-anchor="middle" font-size="23" fill="#687582">字节码交给解释器，机器码交给CPU · 以CPython为例</text>
  </g>
</svg>
